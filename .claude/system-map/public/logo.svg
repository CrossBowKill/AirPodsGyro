  <!-- Layer 3 -->
  <path d="M256 344 L400 272 L256 200 L112 272 Z" fill="url(#brand-gradient)" opacity="0.4"/>

  <!-- Layer 2 -->
  <path d="M256 288 L400 216 L256 144 L112 216 Z" fill="url(#brand-gradient)" opacity="0.65"/>

  <!-- Layer 1 (top, brightest) -->
