# automations.yml: every automation you run, so /pulse can ask each one "did you fire?"
#
# Read by .claude/scripts/pulse-check.py (standard-library python3, read-only) and by the
# /pulse command. One entry per scheduled job, webhook, workflow, or hand-run ritual.
# Replace the examples below with your own; they are illustrations, not live checks.
#
# Fields per entry:
#   name                     unique label, used in the snapshot diff
#   kind                     free text: cron, n8n, webhook, github-action, manual, ...
#   check                    how /pulse verifies it. One of:
#                              cron-log   the job appends one line per run to `path`; the last
#                                         line's timestamp (ISO or epoch) or the file mtime is
#                                         the last run, error words in the last line = FAILING
#                              http       GET `url`, compare to `expected_status` (default 200)
#                              n8n-mcp    read through the read-only n8n MCP tools by /pulse
#                                         (list workflows + executions); needs `workflow_name`
#                              manual     you confirm by hand; set `last_confirmed: YYYY-MM-DD`
#                                         (and `status: failing` plus a `note` if it is broken)
#   expected_interval_hours  how often it should run (default from `defaults`)
#   grace_factor             STALE once hours since last run exceed interval x grace
#   silent_after_hours       SILENT once no run inside this many hours (default 168 = 7 days)
#   critical: true           on a money, delivery, or sending path: a failure is RED and /pulse
#                            recommends /red-team on the fix
#   active: false            listed but switched off: reported as INACTIVE, never flagged
#
# Event-driven jobs (webhooks): give them a long interval (168) and rely on SILENT. With real
# traffic, a week of zero runs means the endpoint stopped receiving events.

defaults:
  grace_factor: 1.5
  silent_after_hours: 168
  expected_interval_hours: 168
  http_timeout_seconds: 10

automations: []

# Examples (uncomment and edit to describe your own jobs; /pulse reports nothing until you do):
#   - name: Nightly database backup
